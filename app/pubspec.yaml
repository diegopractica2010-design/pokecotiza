name: pokecotiza
description: "Valorización de la colección de cartas Pokémon (Android y Windows)."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  pokecotiza_core:
    path: ../packages/core
  path_provider: ^2.1.5
  url_launcher: ^6.3.0
  google_sign_in: ^7.2.0
  googleapis_auth: ^2.3.5
  flutter_secure_storage: ^11.2.0
  http: ^1.2.0
  excel: ^4.0.6
  file_picker: ">=13.1.0 <13.2.0"

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
