name: App (Android y Windows)

on:
  pull_request:
    paths: ['app/**', 'packages/core/**', '.github/workflows/app.yml']
  push:
    branches: [main]
    paths: ['app/**', 'packages/core/**', '.github/workflows/app.yml']
  workflow_dispatch:

env:
  FLUTTER_VERSION: 3.47.9

jobs:
  pruebas:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Análisis estático
        run: flutter analyze
      - name: Pruebas
        run: flutter test

  android:
    needs: pruebas
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Preparar clave de firma (si existe el secreto)
        env:
          CLAVE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$CLAVE_BASE64" ]; then
            echo "$CLAVE_BASE64" | base64 -d > "$RUNNER_TEMP/pokecotiza.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/pokecotiza.jks" >> "$GITHUB_ENV"
            echo "Se firma con la clave estable del repositorio."
          else
            echo "::warning::Sin secreto ANDROID_KEYSTORE_BASE64: el APK se firma con la clave de desarrollo y no podrá actualizar una instalación anterior. Ver docs/firma-android.md."
          fi
      - name: Compilar APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: pokecotiza-android
          path: app/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

  windows:
    needs: pruebas
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Compilar para Windows
        run: flutter build windows --release
      - uses: actions/upload-artifact@v4
        with:
          name: pokecotiza-windows
          path: app/build/windows/x64/runner/Release/
          retention-days: 30
