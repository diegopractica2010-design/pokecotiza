name: Publicar versión

# Se ejecuta al crear una versión de dos formas:
#   - etiqueta desde la terminal: git tag v0.1.0 && git push origin v0.1.0
#   - desde la página Releases de GitHub (crea la etiqueta y publica el Release)
# Compila Android y Windows y los adjunta al Release.
on:
  push:
    tags: ['v*']
  release:
    types: [published]

permissions:
  contents: write

# Crear la etiqueta desde la terminal y luego publicar el Release dispara
# ambos eventos: se ejecuta una sola vez por versión.
concurrency:
  group: publicar-${{ github.ref_name }}
  cancel-in-progress: false

env:
  FLUTTER_VERSION: 3.47.9

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Pruebas
        run: flutter test
      - name: Preparar clave de firma (si existe el secreto)
        env:
          CLAVE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$CLAVE_BASE64" ]; then
            echo "$CLAVE_BASE64" | base64 -d > "$RUNNER_TEMP/pokecotiza.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/pokecotiza.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::Sin clave estable: esta versión no podrá actualizar una instalación anterior. Ver docs/firma-android.md."
          fi
      - name: Compilar APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          GOOGLE_SERVER_CLIENT_ID: ${{ vars.GOOGLE_SERVER_CLIENT_ID }}
        run: flutter build apk --release --dart-define=GOOGLE_SERVER_CLIENT_ID="$GOOGLE_SERVER_CLIENT_ID"
      - name: Renombrar
        run: cp build/app/outputs/flutter-apk/app-release.apk "$RUNNER_TEMP/pokecotiza-${GITHUB_REF_NAME}-android.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: ${{ runner.temp }}/pokecotiza-${{ github.ref_name }}-android.apk

  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Compilar para Windows
        shell: bash
        env:
          GOOGLE_DESKTOP_CLIENT_ID: ${{ vars.GOOGLE_DESKTOP_CLIENT_ID }}
          GOOGLE_DESKTOP_CLIENT_SECRET: ${{ secrets.GOOGLE_DESKTOP_CLIENT_SECRET }}
        run: >-
          flutter build windows --release
          --dart-define=GOOGLE_DESKTOP_CLIENT_ID="$GOOGLE_DESKTOP_CLIENT_ID"
          --dart-define=GOOGLE_DESKTOP_CLIENT_SECRET="$GOOGLE_DESKTOP_CLIENT_SECRET"
      - name: Incluir el runtime de Visual C++
        # Guía de Flutter para armar un zip de Windows: incluir estas DLL junto
        # al .exe para que abra en PCs sin el Visual C++ Redistributable.
        shell: pwsh
        run: |
          foreach ($dll in 'msvcp140.dll','vcruntime140.dll','vcruntime140_1.dll') {
            Copy-Item "$env:WINDIR\System32\$dll" build/windows/x64/runner/Release/
          }
      - name: Comprimir
        shell: pwsh
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath "$env:RUNNER_TEMP/pokecotiza-$env:GITHUB_REF_NAME-windows.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: ${{ runner.temp }}/pokecotiza-${{ github.ref_name }}-windows.zip

  release:
    needs: [android, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Crear el Release o agregarle los instaladores
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            # Creado desde la página Releases: se le suben los archivos.
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* \
              --title "PokeCotiza $GITHUB_REF_NAME" \
              --notes "Instaladores de PokeCotiza $GITHUB_REF_NAME. Cómo instalar: docs/instalar.md. Cambios: CHANGELOG.md."
          fi
