name: Publicar versión

# Se ejecuta al crear una etiqueta de versión, por ejemplo:
#   git tag v0.1.0 && git push origin v0.1.0
# Compila Android y Windows y los adjunta a un "Release" de GitHub.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  FLUTTER_VERSION: 3.47.9

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Pruebas
        run: flutter test
      - name: Preparar clave de firma (si existe el secreto)
        env:
          CLAVE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$CLAVE_BASE64" ]; then
            echo "$CLAVE_BASE64" | base64 -d > "$RUNNER_TEMP/pokecotiza.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/pokecotiza.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::Sin clave estable: esta versión no podrá actualizar una instalación anterior. Ver docs/firma-android.md."
          fi
      - name: Compilar APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          GOOGLE_SERVER_CLIENT_ID: ${{ vars.GOOGLE_SERVER_CLIENT_ID }}
        run: flutter build apk --release --dart-define=GOOGLE_SERVER_CLIENT_ID="$GOOGLE_SERVER_CLIENT_ID"
      - name: Renombrar
        run: cp build/app/outputs/flutter-apk/app-release.apk "$RUNNER_TEMP/pokecotiza-${GITHUB_REF_NAME}-android.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: ${{ runner.temp }}/pokecotiza-${{ github.ref_name }}-android.apk

  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Compilar para Windows
        shell: bash
        env:
          GOOGLE_DESKTOP_CLIENT_ID: ${{ vars.GOOGLE_DESKTOP_CLIENT_ID }}
          GOOGLE_DESKTOP_CLIENT_SECRET: ${{ secrets.GOOGLE_DESKTOP_CLIENT_SECRET }}
        run: >-
          flutter build windows --release
          --dart-define=GOOGLE_DESKTOP_CLIENT_ID="$GOOGLE_DESKTOP_CLIENT_ID"
          --dart-define=GOOGLE_DESKTOP_CLIENT_SECRET="$GOOGLE_DESKTOP_CLIENT_SECRET"
      - name: Comprimir
        shell: pwsh
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath "$env:RUNNER_TEMP/pokecotiza-$env:GITHUB_REF_NAME-windows.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: ${{ runner.temp }}/pokecotiza-${{ github.ref_name }}-windows.zip

  release:
    needs: [android, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Crear el Release con los instaladores
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "PokeCotiza $GITHUB_REF_NAME" \
            --notes "Instaladores de PokeCotiza $GITHUB_REF_NAME. Cómo instalar: docs/instalar.md. Cambios: CHANGELOG.md."
